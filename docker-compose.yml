services:
  # ========================================================
  # 1. BANCO DE DADOS POSTGRESQL COM SEED COMPLETO AUTOMÁTICO
  # ========================================================
  db:
    image: postgres:17-alpine
    container_name: bamba-aqua-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-storedb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Ft22N*644p}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-storedb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bamba-network

  # ========================================================
  # 2. BACKEND API (SPRING BOOT / JAVA 21)
  # ========================================================
  backend:
    build:
      context: ./backend/store-management-api
      dockerfile: Dockerfile
    container_name: bamba-aqua-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-storedb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Ft22N*644p}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SECURITY_JWT_SECRET: ${JWT_SECRET:-YmFtYmEtYXF1YS1zdXBlci1zZWNyZXQtand0LWtleS0yMDI2LWZvci1wcm9kdWN0aW9uLWFuZC1kZXZlbG9wbWVudA==}
      SECURITY_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-43200000}
      APP_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - bamba-network

  # ========================================================
  # 3. FRONTEND WEB (REACT / VITE + PROXY REVERSO NGINX)
  # ========================================================
  frontend:
    build:
      context: ./frontend/store-management-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: bamba-aqua-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Padrão porta 80 para acesso limpo e compatibilidade direta com túneis
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - bamba-network

volumes:
  db_data:
    name: bamba_aqua_db_data

networks:
  bamba-network:
    name: bamba_aqua_network
    driver: bridge
